<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">DSH CodeBuddy CLI 调用流程</title><desc id="desc">DSH 将对话和工具说明交给插件，插件调用本机官方 CLI，CLI 连接官方模型服务。工具请求返回 DSH 执行。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#66a6ff"/></marker></defs>
<rect width="1200" height="520" rx="24" fill="#101827"/>
<g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="54" y="62" fill="#fff" font-size="28" font-weight="700">DSH CodeBuddy CLI · 调用流程</text>
<text x="54" y="98" fill="#a9b8d0" font-size="17">模型通过官方 CLI 调用；文件和命令工具由 DSH 管理</text>
<g fill="#1c2b43" stroke="#46617f" stroke-width="1.5"><rect x="54" y="165" width="220" height="122" rx="15"/><rect x="340" y="165" width="220" height="122" rx="15"/><rect x="626" y="165" width="220" height="122" rx="15"/><rect x="912" y="165" width="234" height="122" rx="15"/></g>
<g fill="#fff" font-size="21" font-weight="600" text-anchor="middle"><text x="164" y="211">DeepSeek Harness</text><text x="450" y="211">本机插件</text><text x="736" y="211">官方 CodeBuddy CLI</text><text x="1029" y="211">官方模型服务</text></g>
<g fill="#a9b8d0" font-size="17" text-anchor="middle"><text x="164" y="248">对话 · 历史 · 工具执行</text><text x="450" y="248">整理输入 · 校验结果</text><text x="736" y="248">官方登录 · 无头调用</text><text x="1029" y="248">账号权限 · 模型响应</text></g>
<g fill="none" stroke="#66a6ff" stroke-width="2.5" marker-end="url(#arrow)"><path d="M275 208H326"/><path d="M562 208H612"/><path d="M848 208H898"/><path d="M912 268V350H164V303"/></g>
<text x="600" y="335" fill="#bfd8ff" font-size="18" text-anchor="middle">回复 / 工具请求，经 CLI 和插件返回 DSH</text>
<rect x="54" y="395" width="1092" height="78" rx="12" fill="#17243a"/>
<text x="78" y="426" fill="#e3eaf5" font-size="18">需要工具时：DSH 执行 → 结果加入历史 → 下一轮模型请求</text>
<text x="78" y="454" fill="#a9b8d0" font-size="16">模型目录和积分倍率另由 ACP 检测；剩余积分到官方账号页面查看。</text>
</g></svg>
